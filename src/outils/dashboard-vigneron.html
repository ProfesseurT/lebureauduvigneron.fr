<!-- Le panneau de reglages, partage avec /mon-bureau/. Fusion du 07/09/2026 : « Reglages »
     et « Ma base » ne sont plus des ecrans d'ici, ce sont deux blocs de ce panneau-la. -->
<script src="/js/bdv-reglages.js" defer></script>
<!-- Verrou pose AVANT le premier pixel. Sans compte, rien du tableau de bord ne s'affiche,
     pas meme la zone de depot. On lit la session directement dans localStorage au lieu
     d'attendre bdv-compte.js, qui est charge en defer : sinon la page s'afficherait une
     fraction de seconde avant que la porte ne la recouvre, et ce clignotement montrerait
     justement ce qu'on veut cacher. Le verrou est leve par le bloc INIT en fin de page. -->
<script>
  try{
    var _bdvS = JSON.parse(localStorage.getItem('bdv_session'));
    if(!(_bdvS && _bdvS.access_token && _bdvS.user)) document.documentElement.className += ' bdv-verrou';
  }catch(e){ document.documentElement.className += ' bdv-verrou'; }
</script>
<style>html.bdv-verrou body > *:not(.bdv-porte){visibility:hidden}</style>
<!-- La mise en forme des ecrans a demenage dans /css/bdv-ecrans.css le 07/09/2026,
     lot 0 de la fusion dans le bureau. Posee ICI et pas ailleurs : juste apres le
     verrou ci-dessus, pour que la cascade reste celle du fichier d'origine. -->
<link rel="stylesheet" href="/css/bdv-ecrans.css">
<!-- Le reset global (html, body, les titres, les liens) que cette page-ci est seule a
     avoir besoin : elle n'a pas src/css/style.css. Le bureau, lui, l'a deja, et charger
     ces cinq regles chez lui aurait rabattu l'interlignage du site de 1,7 a 1,5.
     Disparait avec cette page au lot 2d. -->
<link rel="stylesheet" href="/css/bdv-ecrans-page.css">
</head>
<body>

<!-- La coque des ecrans de vente a demenage dans _includes/components/ecrans-vente.njk
     le 07/09/2026, lot 2b de la fusion. Le bureau inclut la MEME, ce qui garantit que
     les trente-deux id dont bdv-ecrans.js a besoin sont les memes aux deux endroits.
     Une coque recopiee aurait divergé le jour ou l'un des deux aurait gagne un ecran. -->
{% include "components/ecrans-vente.njk" %}

<!-- LE MOTEUR DE LA BASE. Sans defer et AVANT le script ci-dessous : ce dernier lit des
     variables declarees la-dedans des son analyse. Voir l'entete de bdv-base.js. -->
<script src="/js/bdv-base.js"></script>
<!-- Les ecrans de vente ont demenage dans /js/bdv-ecrans.js le 07/09/2026, lot 0 de
     la fusion dans le bureau. Sans defer et APRES bdv-base.js : cet ordre est une
     condition, pas une preference. Voir l'entete de bdv-ecrans.js. -->
<script src="/js/bdv-ecrans.js"></script>
</body>
